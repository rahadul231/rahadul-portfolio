<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081A33">
  <meta name="description" content="Md. Rahadul Islam — AI and machine learning portfolio in progress.">
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <title>Md. Rahadul Islam | AI/ML Portfolio</title>
  <style>
    :root { color-scheme: dark; --bg:#081A33; --card:#152D4A; --text:#F5F7FC; --accent:#91ABC9; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font: 400 16px/1.75 Inter, system-ui, -apple-system, Segoe UI, sans-serif; display:grid; place-items:center; }
    main { width:min(730px, calc(100% - 40px)); padding:64px 0; }
    .mark { width:74px; height:74px; border-radius:18px; display:block; margin-bottom:38px; }
    .eyebrow { color:var(--accent); font-size:.78rem; font-weight:600; text-transform:uppercase; letter-spacing:.16em; margin:0 0 16px; }
    h1 { font-family:Manrope, Inter, system-ui, sans-serif; font-weight:800; font-size:clamp(2.25rem,7vw,4.25rem); line-height:1.16; letter-spacing:-.045em; margin:0 0 26px; }
    .claim { font-size:clamp(1.05rem,2.4vw,1.3rem); max-width:620px; color:#D7E0EB; line-height:1.7; margin:0; }
    .rule { border:0; border-top:1px solid #38516C; margin:42px 0 20px; }
    .meta { color:var(--accent); font-size:.9rem; margin:0; }
    @media (max-width:480px) { .mark { width:60px; height:60px; margin-bottom:26px; } main { padding:45px 0; } }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="./favicon.png" alt="RI monogram">
    <p class="eyebrow">AI / Machine Learning Portfolio</p>
    <h1>Md. Rahadul Islam</h1>
    <p class="claim">I develop my AI/ML skills through real datasets, research decisions, and experiments.</p>
    <hr class="rule">
    <p class="meta">Portfolio in progress · Projects and case studies coming soon</p>
  </main>
</body>
</html>
